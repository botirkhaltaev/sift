[package]
name = "sift-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
readme = "README.md"
license.workspace = true
homepage.workspace = true
documentation.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
ast-grep-core = "=0.45.0"
bitflags = { version = "2", features = ["serde"] }
bitpacking = { version = "0.9", default-features = false, features = ["bitpacker4x"] }
fslock = "0.2"
encoding_rs = "0.8"
fastio = { version = "0.3", default-features = false, features = ["sync", "mmap", "io-uring"] }
ignore = "0.4"
integer-encoding = "4"
memchr = "2"
memmap2 = "0.9"
pcre2 = "0.2"
rayon = "1"
regex = "1"
regex-automata = "0.4"
regex-syntax = "0.8"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tree-sitter = "0.26"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "query"
harness = false

[[bench]]
name = "index"
harness = false

[[bench]]
name = "grep"
harness = false

[[bench]]
name = "candidates"
harness = false

[[test]]
name = "index"
path = "tests/index/main.rs"

[[test]]
name = "grep"
path = "tests/grep/main.rs"
